<!DOCTYPE html>
<html lang="da">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#b8c8ea">
    <title>Katten på Taget</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,650&family=Source+Serif+4:ital,wght@0,400;0,500;0,600;1,400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="page">
        <header class="hero">
            <h1 class="site-title">Katten på Taget</h1>
            <div class="sunset-tracker">
                <p class="sunset-line">
                    <span id="sunset-label">Solnedgang i aften</span>
                    · <span id="sunset-time">Henter...</span>
                    <span class="sunset-weather" id="sunset-weather" hidden>
                        <span class="weather-icon" id="weather-icon" aria-hidden="true"></span>
                        <span id="weather-label"></span>
                    </span>
                </p>
                <p class="sunset-sub" id="sunset-sub" hidden></p>
            </div>
        </header>

        <section class="playlist" aria-label="Spotify playliste">
            <iframe
                src="https://open.spotify.com/embed/playlist/7LhjmBWw6e0DSkPuYn06Od?utm_source=generator"
                width="100%"
                height="352"
                allow="autoplay; clipboard-write; encrypted-media; fullscreen; picture-in-picture"
                loading="lazy"
                title="Spotify playliste">
            </iframe>
        </section>

        <section class="lyrics" aria-label="Sange">
            <a class="lyric" href="https://hojskolesangbogen.dk/om-sangbogen/historier-om-sangene/s/stille-hjerte-sol-gaar-ned-aften">
                <span class="lyric-title">Stille, hjerte, sol går ned</span>
                <span class="lyric-artist">Jeppe Aakjær, 1912</span>
            </a>
            <a class="lyric" href="https://hojskolesangbogen.dk/om-sangbogen/historier-om-sangene/j-l/lyse-naetter">
                <span class="lyric-title">Lyse nætter</span>
                <span class="lyric-artist">Alberte Winding, 1991</span>
            </a>
            <a class="lyric" href="https://festklaveret.dk/tekst/191/svantes+lykkelige+dag.html">
                <span class="lyric-title">Svantes lykkelige dag</span>
                <span class="lyric-artist">Benny Andersen, 1974</span>
            </a>
        </section>

        <figure class="solkat">
            <img src="solkat.png" alt="En kat der ligger i solen på et tag med udsigt over København" loading="lazy">
        </figure>
    </main>

    <script>
        const lat = 55.6761;
        const lng = 12.5683;

        const WEATHER_ICONS = {
            clear: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/></svg>',
            partly: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 10h-1.26A8 8 0 1 0 9 18h9a5 5 0 0 0 0-10z"/></svg>',
            cloudy: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 10h-1.26A8 8 0 1 0 7.5 17.5H18a5 5 0 1 0 0-7.5z"/></svg>',
            fog: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M4 14h16M4 18h10M6 10h14"/></svg>',
            rain: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 10h-1.26A8 8 0 1 0 7.5 17.5H18a5 5 0 1 0 0-7.5z"/><path d="M8 19v2M12 19v2M16 19v2"/></svg>',
            snow: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 10h-1.26A8 8 0 1 0 7.5 17.5H18a5 5 0 1 0 0-7.5z"/><circle cx="8" cy="20" r="1" fill="currentColor"/><circle cx="12" cy="20" r="1" fill="currentColor"/><circle cx="16" cy="20" r="1" fill="currentColor"/></svg>',
            storm: '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.75"><path d="M18 10h-1.26A8 8 0 1 0 7.5 17.5H18a5 5 0 1 0 0-7.5z"/><path d="M13 17l-3 5h4l-2 4"/></svg>'
        };

        function weatherFromCode(code) {
            if (code === 0) return { label: 'Klart', icon: 'clear' };
            if (code === 1) return { label: 'Let skyet', icon: 'partly' };
            if (code === 2) return { label: 'Delvist overskyet', icon: 'partly' };
            if (code === 3) return { label: 'Overskyet', icon: 'cloudy' };
            if (code === 45 || code === 48) return { label: 'Tåge', icon: 'fog' };
            if (code >= 51 && code <= 67) return { label: 'Regn', icon: 'rain' };
            if (code >= 71 && code <= 77) return { label: 'Sne', icon: 'snow' };
            if (code >= 80 && code <= 82) return { label: 'Byger', icon: 'rain' };
            if (code >= 85 && code <= 86) return { label: 'Snebyger', icon: 'snow' };
            if (code >= 95) return { label: 'Torden', icon: 'storm' };
            return { label: 'Ukendt', icon: 'partly' };
        }

        function nearestHourIndex(times, targetMs) {
            let bestIdx = 0;
            let bestDiff = Infinity;
            for (let i = 0; i < times.length; i++) {
                const diff = Math.abs(new Date(times[i]).getTime() - targetMs);
                if (diff < bestDiff) {
                    bestDiff = diff;
                    bestIdx = i;
                }
            }
            return bestIdx;
        }

        const SKY_PALETTES = {
            night: {
                top: [6, 6, 24],
                mid: [18, 18, 52],
                bottom: [42, 38, 88],
                glow: [90, 110, 170, 0.28],
                glowY: 6,
                horizon: [80, 60, 120, 0.42]
            },
            preDawn: {
                top: [24, 22, 58],
                mid: [42, 36, 82],
                bottom: [68, 52, 102],
                glow: [130, 100, 150, 0.38],
                glowY: -2,
                horizon: [130, 85, 135, 0.35]
            },
            dawn: {
                top: [255, 235, 225],
                mid: [238, 200, 195],
                bottom: [175, 195, 235],
                glow: [255, 175, 130, 0.62],
                glowY: -6,
                horizon: [255, 150, 110, 0.45]
            },
            day: {
                top: [248, 250, 255],
                mid: [198, 212, 240],
                bottom: [140, 165, 215],
                glow: [240, 198, 116, 0.55],
                glowY: -10,
                horizon: [244, 185, 145, 0.34]
            },
            golden: {
                top: [255, 240, 210],
                mid: [248, 200, 155],
                bottom: [210, 155, 115],
                glow: [244, 155, 100, 0.68],
                glowY: 4,
                horizon: [240, 115, 75, 0.48]
            },
            dusk: {
                top: [38, 32, 68],
                mid: [105, 62, 88],
                bottom: [205, 128, 100],
                glow: [244, 110, 70, 0.52],
                glowY: 22,
                horizon: [255, 95, 60, 0.38]
            }
        };

        function clamp(value, min, max) {
            return Math.max(min, Math.min(max, value));
        }

        function lerp(a, b, t) {
            return a + (b - a) * t;
        }

        function blendPalette(from, to, t) {
            t = clamp(t, 0, 1);
            return {
                top: from.top.map((channel, i) => Math.round(lerp(channel, to.top[i], t))),
                mid: from.mid.map((channel, i) => Math.round(lerp(channel, to.mid[i], t))),
                bottom: from.bottom.map((channel, i) => Math.round(lerp(channel, to.bottom[i], t))),
                glow: from.glow.map((channel, i) => i < 3
                    ? Math.round(lerp(channel, to.glow[i], t))
                    : lerp(channel, to.glow[i], t)),
                glowY: lerp(from.glowY, to.glowY, t),
                horizon: from.horizon.map((channel, i) => i < 3
                    ? Math.round(lerp(channel, to.horizon[i], t))
                    : lerp(channel, to.horizon[i], t))
            };
        }

        function rgbToCss([r, g, b]) {
            return `rgb(${r}, ${g}, ${b})`;
        }

        function applySky(palette) {
            const root = document.documentElement;
            root.style.setProperty('--sky-top', rgbToCss(palette.top));
            root.style.setProperty('--sky-mid', rgbToCss(palette.mid));
            root.style.setProperty('--sky-bottom', rgbToCss(palette.bottom));
            root.style.setProperty('--sky-glow', `rgba(${palette.glow.join(', ')})`);
            root.style.setProperty('--sky-glow-y', `${palette.glowY}%`);
            root.style.setProperty('--sky-horizon', `rgba(${palette.horizon.join(', ')})`);

            const themeColor = document.querySelector('meta[name="theme-color"]');
            if (themeColor) {
                themeColor.setAttribute('content', rgbToCss(palette.mid));
            }
        }

        function skyPaletteForTime(sunriseMs, sunsetMs, nowMs) {
            const hour = 60 * 60 * 1000;
            const dawnStart = sunriseMs - hour;
            const dawnEnd = sunriseMs + hour;
            const goldenStart = sunsetMs - 1.5 * hour;
            const duskMid = sunsetMs + 20 * 60 * 1000;
            const duskEnd = sunsetMs + 45 * 60 * 1000;

            if (nowMs < dawnStart) {
                return SKY_PALETTES.night;
            }
            if (nowMs < sunriseMs) {
                return blendPalette(SKY_PALETTES.night, SKY_PALETTES.preDawn, (nowMs - dawnStart) / (sunriseMs - dawnStart));
            }
            if (nowMs < dawnEnd) {
                return blendPalette(SKY_PALETTES.dawn, SKY_PALETTES.day, (nowMs - sunriseMs) / (dawnEnd - sunriseMs));
            }
            if (nowMs < goldenStart) {
                return SKY_PALETTES.day;
            }
            if (nowMs < sunsetMs) {
                return blendPalette(SKY_PALETTES.day, SKY_PALETTES.golden, (nowMs - goldenStart) / (sunsetMs - goldenStart));
            }
            if (nowMs < duskMid) {
                return blendPalette(SKY_PALETTES.golden, SKY_PALETTES.dusk, (nowMs - sunsetMs) / (duskMid - sunsetMs));
            }
            if (nowMs < duskEnd) {
                return blendPalette(SKY_PALETTES.dusk, SKY_PALETTES.night, (nowMs - duskMid) / (duskEnd - duskMid));
            }
            return SKY_PALETTES.night;
        }

        function formatSunTime(date) {
            return date.toLocaleTimeString('da-DK', {
                hour: '2-digit',
                minute: '2-digit',
                hour12: false
            });
        }

        function formatCountdown(msUntil) {
            const totalMinutes = Math.ceil(msUntil / 60000);

            if (totalMinutes <= 0) {
                return '';
            }
            if (totalMinutes === 1) {
                return 'om 1 minut';
            }
            if (totalMinutes < 60) {
                return `om ${totalMinutes} minutter`;
            }

            const hours = Math.floor(totalMinutes / 60);
            const minutes = totalMinutes % 60;
            const hourWord = hours === 1 ? '1 time' : `${hours} timer`;

            if (minutes === 0) {
                return `om ${hourWord}`;
            }

            const minuteWord = minutes === 1 ? '1 minut' : `${minutes} minutter`;
            return `om ${hourWord} og ${minuteWord}`;
        }

        let sunTimes = null;

        function updateLiveSunState() {
            if (!sunTimes) {
                return;
            }

            const now = Date.now();
            const { sunrise, sunset } = sunTimes;
            const labelEl = document.getElementById('sunset-label');
            const timeEl = document.getElementById('sunset-time');
            const subEl = document.getElementById('sunset-sub');
            const sunsetMs = sunset.getTime();
            const timeStr = formatSunTime(sunset);

            applySky(skyPaletteForTime(sunrise.getTime(), sunsetMs, now));

            if (now >= sunsetMs) {
                labelEl.textContent = 'Solen gik ned kl.';
                timeEl.textContent = timeStr;
                subEl.textContent = 'Solen er nede. Katten er stadig på taget.';
            } else {
                labelEl.textContent = 'Solnedgang i aften';
                timeEl.textContent = timeStr;
                subEl.textContent = formatCountdown(sunsetMs - now);
            }

            subEl.hidden = !subEl.textContent;
        }

        async function loadSunset() {
            const timeEl = document.getElementById('sunset-time');
            const weatherEl = document.getElementById('sunset-weather');
            const iconEl = document.getElementById('weather-icon');
            const labelEl = document.getElementById('weather-label');

            try {
                const [sunRes, weatherRes] = await Promise.all([
                    fetch(`https://api.sunrise-sunset.org/json?lat=${lat}&lng=${lng}&formatted=0`),
                    fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${lng}&hourly=weather_code&timezone=Europe%2FCopenhagen&forecast_days=2`)
                ]);

                const sunData = await sunRes.json();
                const weatherData = await weatherRes.json();
                const sunriseDate = new Date(sunData.results.sunrise);
                const sunsetDate = new Date(sunData.results.sunset);

                sunTimes = { sunrise: sunriseDate, sunset: sunsetDate };
                updateLiveSunState();
                setInterval(updateLiveSunState, 60000);

                const idx = nearestHourIndex(weatherData.hourly.time, sunsetDate.getTime());
                const { label, icon } = weatherFromCode(weatherData.hourly.weather_code[idx]);

                iconEl.innerHTML = WEATHER_ICONS[icon];
                labelEl.textContent = label;
                weatherEl.hidden = false;
                weatherEl.setAttribute('aria-label', `Vejr ved solnedgang: ${label}`);
            } catch (error) {
                console.error('Fejl ved hentning af solnedgang/vejr:', error);
                timeEl.textContent = 'Kunne ikke hentes';
            }
        }

        loadSunset();
    </script>
</body>
</html>
